<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Layers</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
    font-family: system-ui, times-new-roman;
  }
  #stage {
    position: fixed;
    inset: 0 0 70px 0;   /* leaves room for the slider bar */
    cursor: pointer;
    user-select: none;
  }
  #stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }
  #bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #1c1c1c;
    color: #ddd;
    font-size: 14px;
  }
  #opacity {
    width: min(600px, 70vw);
    accent-color: #fff;
  }
  #value { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div id="stage" title="Click for a new pair">
  <img id="imgB" alt="">   <!-- bottom layer (the "b" image) -->
  <img id="imgA" alt="">   <!-- top layer (the "a" image, controlled by slider) -->
</div>

<div id="err" style="position:fixed;top:12px;left:12px;right:12px;padding:10px 14px;background:#7a1f1f;color:#fff;font:14px system-ui;border-radius:6px;display:none;z-index:5"></div>

<div id="bar">
  <span>Top image opacity</span>
  <input type="range" id="opacity" min="0" max="100" value="100">
  <span id="value">100%</span>
</div>

<script>
  // ====== EDIT THIS LIST ======
  // Each pair: a = top image (the one the slider fades), b = bottom image.
  // Put the image files in the same folder as this HTML file,
  // or use full paths / URLs.
  const pairs = [
    { a: "image1a.png", b: "image1b.png" },
    { a: "image2a.png", b: "image2b.png" },
    { a: "image3a.png", b: "image3b.png" },
    { a: "image4a.png", b: "image4b.png" },
    { a: "image5a.png", b: "image5b.png" },
    { a: "image6a.png", b: "image6b.png" },
    { a: "image7a.png", b: "image7b.png" },
    { a: "image8a.png", b: "image8b.png" },
    { a: "image9a.png", b: "image9b.png" },
  ];
  // =============================

  const imgA = document.getElementById("imgA");
  const imgB = document.getElementById("imgB");
  const slider = document.getElementById("opacity");
  const valueLabel = document.getElementById("value");
  const stage = document.getElementById("stage");

  let current = -1;

  function setOpacity(v) {
    imgA.style.opacity = v / 100;
    valueLabel.textContent = Math.round(v) + "%";
  }

  function showRandomPair() {
    if (pairs.length === 0) return;
    let next;
    do {
      next = Math.floor(Math.random() * pairs.length);
    } while (pairs.length > 1 && next === current);
    current = next;

    imgA.src = pairs[current].a;
    imgB.src = pairs[current].b;

    slider.value = 100;   // reset slider on every new pair
    setOpacity(100);
  }

  const err = document.getElementById("err");
  function onFail(e) {
    const name = decodeURIComponent(e.target.src.split("/").pop());
    err.style.display = "block";
    err.textContent = "Can't load \"" + name + "\". Make sure it is in the same folder as index.html (not inside a zip) and the name matches exactly.";
  }
  imgA.addEventListener("error", onFail);
  imgB.addEventListener("error", onFail);
  imgA.addEventListener("load", () => { if (imgB.complete && imgB.naturalWidth) err.style.display = "none"; });

  slider.addEventListener("input", () => setOpacity(slider.value));
  stage.addEventListener("click", showRandomPair);

  showRandomPair();
</script>
</body>
</html>
